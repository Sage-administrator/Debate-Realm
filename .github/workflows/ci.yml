name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

# 取消同一 PR/分支上的冗余运行：新 push 自动终止旧的进行中任务
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Job 1: 代码风格 & Lint
  # ──────────────────────────────────────────
  lint-format:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint Check
        run: npm run lint

  # ──────────────────────────────────────────
  # Job 2: TypeScript 类型检查
  # ──────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

  # ──────────────────────────────────────────
  # Job 3: 辩论模板 Schema 校验
  # ──────────────────────────────────────────
  template-validate:
    name: Template Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Debate Templates
        run: npm run validate:templates

  # ──────────────────────────────────────────
  # Job 4: Prisma Schema 校验
  # ──────────────────────────────────────────
  prisma-validate:
    name: Prisma Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Prisma Client
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}

      - name: Prisma Validate
        run: npx prisma validate

  # ──────────────────────────────────────────
  # Job 5: 安全审计
  # ──────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 仅报告 critical/high 级别漏洞，不阻塞 CI
      - name: npm audit (critical & high)
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────
  # Job 6: 单元测试 + 覆盖率
  # ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npx vitest run --coverage 2>/dev/null || npm run test

      - name: Report Coverage (summary)
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage report generated"
            node -e "
              const r = require('./coverage/coverage-summary.json').total;
              if (r) console.log('Lines:', r.lines?.pct + '%', '| Branches:', r.branches?.pct + '%', '| Functions:', r.functions?.pct + '%');
            "
          else
            echo "No coverage report (--coverage flag may require @vitest/coverage-v8)"
          fi

  # ──────────────────────────────────────────
  # Job 7: 生产构建验证
  # ──────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建产物缓存（供 deploy job 复用）
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: .output
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
